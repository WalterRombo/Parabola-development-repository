<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0d0b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Parabola" />
  <meta name="description" content="Parabola — Personal Circuit Training Tracker" />

  <title>Parabola</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json" />

  <!-- Apple Touch Icons (for iPhone home screen) -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #root { height: 100%; background: #0d0d0b; }
    body { overflow-x: hidden; }
    /* iOS safe area support */
    body { padding-top: env(safe-area-inset-top); }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React + ReactDOM from CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone (transforms JSX in the browser — no build step needed) -->
  <!-- IMPORTANT: pinned to major version 7. Babel 8 (released June 2026) is a
       breaking change that is NOT compatible with this in-browser JSX setup.
       Never remove the "@7" — without it, this silently jumps to whatever
       Babel ships next and the whole app goes blank with no error. -->
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

  <!-- The App -->
  <script type="text/babel" src="app.jsx" data-presets="react"></script>

  <!-- Register Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW registered:', reg.scope))
          .catch(err => console.log('SW failed:', err));
      });
    }
  </script>
</body>
</html>
